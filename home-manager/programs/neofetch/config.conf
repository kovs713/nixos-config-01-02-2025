print_info() {

	info title
	info "${cl1} ╭─󰍳Distro" distro
	info "${cl1} ├─Kernel" kernel
	info "${cl1} ├─User" users
	info "${cl1} ├─󰏗Packages" packages
	info "${cl1} ╰─Shell" shell
	info "${cl2} ╭─Desktop env" de
	info "${cl2} ├─Terminal" term
	info "${cl2} ├─󰂫Theme" theme
	info "${cl2} ╰─󰂫Icons" icons
	info "${cl3} ╭─Motherboard" model
	info "${cl3} ├─󰍛CPU" cpu
	info "${cl3} ├─󰍹GPU" gpu
	info "${cl3} ├─GPU driver" gpu_driver
	info "${cl3} ├─Resolution" resolution
	info "${cl3} ├─Memory" memory
	info "${cl3} ├─Disk" disk
	info "${cl3} ╰─󰄉Uptime" uptime
	info cols
}

blue="\033[1;34m"
red="\033[1;31m"
reset="\033[0m"
cl0="${reset}"
cl1="${reset}"
cl2="${blue}"
cl3="${red}"

image_backend="ascii"
image_source="auto"
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="tiny"
uptime_shorthand="tiny"
memory_percent="on"
memory_unit="Gib"
package_managers="tiny"
shell_path="off"
shell_version="on"
speed_type="scaling_max_freq"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="on"
gpu_brand="on"
gpu_type="all"
refresh_rate="on"
gtk_shorthand="off"
gtk2="off"
gtk3="on"
public_ip_host="http://ident.me"
